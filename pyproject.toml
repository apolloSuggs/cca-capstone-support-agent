[project]
name = "support-agent"
version = "0.1.0"
description = "A customer support agent built step by step: the CCA Prep Studio Customer Support capstone."
requires-python = ">=3.11"
dependencies = ["anthropic>=2.3,<3", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
